<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Still Here</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
  canvas{display:block;cursor:none}
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   STILL HERE — darkness prototype.
   Everything you perceive is sound, an old voice, and faint particle
   "touch" outlines. No UI. Audio is synthesised; voice is speechSynthesis.
   Debug: window.__game  (add ?debug to the URL for verbose logs)
   ===================================================================== */
const DEBUG = /debug/.test(location.search);
const log = (...a) => console.log('[still-here]', ...a);

// ---------- utils
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const hyp = Math.hypot;
const wrapA = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);

// ---------- constants
const EYE_STAND = 1.55, EYE_SIT = 1.12, EYE_FLOOR = 0.38, PR = 0.25, CATR = 0.12;
const FOV = 75;
const WALK = 0.85;           // old legs
let now = 0;                 // game clock (s)
let SIM = false;             // headless simulation (no audio)

/* =====================================================================
   RENDERING — only particles exist visually
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: DEBUG });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, innerWidth / innerHeight, 0.02, 60);
camera.rotation.order = 'YXZ';

const PMAX = 70000;
const pPos = new Float32Array(PMAX * 3), pBirth = new Float32Array(PMAX).fill(-1e6),
      pLife = new Float32Array(PMAX).fill(1), pSize = new Float32Array(PMAX), pBright = new Float32Array(PMAX);
const pGeo = new THREE.BufferGeometry();
const aPos = new THREE.BufferAttribute(pPos, 3), aBirth = new THREE.BufferAttribute(pBirth, 1),
      aLife = new THREE.BufferAttribute(pLife, 1), aSize = new THREE.BufferAttribute(pSize, 1),
      aBright = new THREE.BufferAttribute(pBright, 1);
[aPos, aBirth, aLife, aSize, aBright].forEach(a => a.setUsage(THREE.DynamicDrawUsage));
pGeo.setAttribute('position', aPos); pGeo.setAttribute('aBirth', aBirth); pGeo.setAttribute('aLife', aLife);
pGeo.setAttribute('aSize', aSize); pGeo.setAttribute('aBright', aBright);
const pMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uScale: { value: 600 } },
  vertexShader: `
    uniform float uTime; uniform float uScale;
    attribute float aBirth; attribute float aLife; attribute float aSize; attribute float aBright;
    varying float vA;
    void main(){
      float age = uTime - aBirth;
      float a = 0.0;
      if(age > 0.0 && age < aLife){
        a = smoothstep(0.0, 0.22, age) * (1.0 - smoothstep(aLife*0.3, aLife, age));
      }
      vec3 p = position;
      float ag = max(age, 0.0);
      p.y += ag * 0.008;
      p.x += sin(ag*2.7 + position.z*37.0) * 0.0025;
      p.z += cos(ag*2.3 + position.x*41.0) * 0.0025;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float d = max(-mv.z, 0.2);
      gl_PointSize = clamp(aSize * uScale / d, 1.0, 5.5);
      vA = a * aBright;
      gl_Position = projectionMatrix * mv;
      if(a <= 0.002) gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
    }`,
  fragmentShader: `
    varying float vA;
    void main(){
      vec2 c = gl_PointCoord - 0.5; float r = dot(c,c);
      if(r > 0.25) discard;
      float f = 1.0 - r*4.0;
      gl_FragColor = vec4(0.93, 0.95, 1.0, vA * f * 0.75);
    }`,
  transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending
});
const pPoints = new THREE.Points(pGeo, pMat);
pPoints.frustumCulled = false;
scene.add(pPoints);
let pHead = 0, pDirty = false;
function emitPoint(x, y, z, birth, life, size, bright) {
  const i = pHead; pHead = (pHead + 1) % PMAX;
  pPos[i * 3] = x; pPos[i * 3 + 1] = y; pPos[i * 3 + 2] = z;
  pBirth[i] = birth; pLife[i] = life; pSize[i] = size; pBright[i] = bright;
  pDirty = true;
}
function onResize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  pMat.uniforms.uScale.value = (renderer.domElement.height / 2) / Math.tan(THREE.MathUtils.degToRad(FOV / 2));
}
addEventListener('resize', onResize); onResize();

/* ---------- shape samplers (points: [x,y,z,brightness]) */
function sampleBox(mn, mx, p, R, out, dens) {
  const lo = [0, 0, 0], hi = [0, 0, 0];
  for (let a = 0; a < 3; a++) { lo[a] = Math.max(mn[a], p[a] - R); hi[a] = Math.min(mx[a], p[a] + R); if (lo[a] > hi[a] + 1e-6) return; }
  const fin = isFinite(R), R2 = R * R;
  const ok = q => !fin || ((q[0] - p[0]) ** 2 + (q[1] - p[1]) ** 2 + (q[2] - p[2]) ** 2) <= R2;
  const e = 1e-6;
  for (let a = 0; a < 3; a++) {              // 12 edges — the outline
    const b = (a + 1) % 3, c = (a + 2) % 3;
    for (const vb of [mn[b], mx[b]]) for (const vc of [mn[c], mx[c]]) {
      if (vb < lo[b] - e || vb > hi[b] + e || vc < lo[c] - e || vc > hi[c] + e) continue;
      const len = hi[a] - lo[a], n = Math.max(1, Math.floor(len / 0.018 * dens));
      for (let i = 0; i <= n; i++) {
        const q = [0, 0, 0];
        q[a] = lo[a] + len * i / n + (Math.random() - 0.5) * 0.01;
        q[b] = vb + (Math.random() - 0.5) * 0.004; q[c] = vc + (Math.random() - 0.5) * 0.004;
        if (ok(q)) out.push([q[0], q[1], q[2], 1]);
      }
    }
  }
  for (let a = 0; a < 3; a++) {              // faces — sparse fill
    const b = (a + 1) % 3, c = (a + 2) % 3;
    for (const v of [mn[a], mx[a]]) {
      if (v < lo[a] - e || v > hi[a] + e) continue;
      const w = hi[b] - lo[b], h = hi[c] - lo[c], n = Math.floor(w * h * 190 * dens);
      for (let i = 0; i < n; i++) {
        const q = [0, 0, 0]; q[a] = v; q[b] = lo[b] + Math.random() * w; q[c] = lo[c] + Math.random() * h;
        if (ok(q)) out.push([q[0], q[1], q[2], 0.4]);
      }
    }
  }
}
function sampleCyl(c, r, h, p, R, out, dens) {
  const fin = isFinite(R), R2 = R * R;
  const push = (x, y, z, b) => { if (!fin || ((x - p[0]) ** 2 + (y - p[1]) ** 2 + (z - p[2]) ** 2) <= R2) out.push([x, y, z, b]); };
  const nr = Math.max(10, Math.floor(2 * Math.PI * r / 0.014 * dens));
  for (const y of [c[1], c[1] + h]) for (let i = 0; i < nr; i++) { const a = i / nr * 2 * Math.PI; push(c[0] + Math.cos(a) * r, y, c[2] + Math.sin(a) * r, 1); }
  for (let k = 0; k < 8; k++) { const a = k / 8 * 2 * Math.PI; for (let y = 0; y <= h; y += 0.02) push(c[0] + Math.cos(a) * r, c[1] + y, c[2] + Math.sin(a) * r, 0.55); }
  const ns = Math.floor(2 * Math.PI * r * h * 220 * dens);
  for (let i = 0; i < ns; i++) { const a = Math.random() * 2 * Math.PI; push(c[0] + Math.cos(a) * r, c[1] + Math.random() * h, c[2] + Math.sin(a) * r, 0.4); }
  const nt = Math.floor(Math.PI * r * r * 300 * dens);
  for (let i = 0; i < nt; i++) { const a = Math.random() * 2 * Math.PI, rr = r * Math.sqrt(Math.random()); push(c[0] + Math.cos(a) * rr, c[1] + h, c[2] + Math.sin(a) * rr, 0.35); }
}
function samplePart(part, p, R, out, dens) {
  if (part.type === 'cyl') sampleCyl(part.c, part.r, part.h, p, R, out, dens);
  else sampleBox(part.min, part.max, p, R, out, dens);
}
function emitSet(pts, p, opt) {
  const R = opt.R;
  const cap = opt.cap || 2600, keep = pts.length > cap ? cap / pts.length : 1;
  const life0 = opt.life || 2.0, spd = opt.speed || 1.3, br = opt.bright || 1;
  for (const q of pts) {
    if (keep < 1 && Math.random() > keep) continue;
    const d = hyp(q[0] - p[0], q[1] - p[1], q[2] - p[2]);
    const fall = isFinite(R) ? (1 - 0.65 * d / R) : 1;
    emitPoint(q[0], q[1], q[2], now + (opt.delay0 || 0) + d / spd + Math.random() * 0.08,
      life0 * rand(0.8, 1.2), rand(0.007, 0.012) * (opt.sizeMul || 1), q[3] * fall * br);
  }
}
function touchObject(o, p, opt = {}) {
  const R = opt.R ?? o.R ?? 0.8, pts = [];
  for (const part of o.parts) samplePart(part, p, R, pts, opt.density || 1);
  emitSet(pts, p, { ...opt, R });
  if (!opt.noGlance) glanceTo(p);
}
// Cat silhouette — ellipsoid body, head, ears, legs, tail. Rim-lit relative to the camera.
function sampleCat(cx, cz, h, contact, opt = {}) {
  if (SIM) return;
  const f = [Math.sin(h), Math.cos(h)], s = [Math.cos(h), -Math.sin(h)];
  const W = (lx, ly, lz) => [cx + s[0] * lx + f[0] * lz, ly, cz + s[1] * lx + f[1] * lz];
  const cam = camera.position, out = [];
  const rim = (q, n) => {
    const v = [q[0] - cam.x, q[1] - cam.y, q[2] - cam.z], l = hyp(...v) || 1;
    const d = Math.abs((v[0] * n[0] + v[1] * n[1] + v[2] * n[2]) / l);
    return 0.2 + 0.8 * Math.pow(1 - d, 2);
  };
  const ellip = (c0, r, n) => {
    for (let i = 0; i < n; i++) {
      let u = [rand(-1, 1), rand(-1, 1), rand(-1, 1)]; const L = hyp(...u) || 1; u = u.map(v => v / L);
      const q = W(c0[0] + u[0] * r[0], c0[1] + u[1] * r[1], c0[2] + u[2] * r[2]);
      const nl = [u[0] / r[0], u[1] / r[1], u[2] / r[2]], nL = hyp(...nl);
      const nw = [(s[0] * nl[0] + f[0] * nl[2]) / nL, nl[1] / nL, (s[1] * nl[0] + f[1] * nl[2]) / nL];
      out.push([...q, rim(q, nw)]);
    }
  };
  const line = (a, b, n, br = 0.9) => { for (let i = 0; i <= n; i++) { const t = i / n; out.push([...W(lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)), br]); } };
  ellip([0, 0.2, 0], [0.075, 0.085, 0.2], 420);       // body
  ellip([0, 0.29, 0.22], [0.062, 0.058, 0.065], 170); // head
  for (const sx of [-1, 1]) {                         // ears
    line([sx * 0.02, 0.33, 0.22], [sx * 0.042, 0.385, 0.215], 8);
    line([sx * 0.042, 0.385, 0.215], [sx * 0.06, 0.315, 0.22], 8);
  }
  for (const lz of [0.13, -0.13]) for (const lx of [-0.04, 0.04]) line([lx, 0.14, lz], [lx, 0.0, lz + 0.01], 10, 0.7); // legs
  for (let i = 0; i <= 26; i++) {                     // tail curl
    const t = i / 26; out.push([...W(0.04 * Math.sin(t * 3), 0.17 + t * 0.26 + Math.sin(t * 3.1) * 0.03, -0.2 - t * 0.16 + t * t * 0.08), 0.85]);
  }
  emitSet(out, contact || [cx, 0.2, cz], { R: Infinity, life: opt.life || 1.8, speed: 0.9, bright: opt.bright || 1 });
  if (!opt.noGlance) glanceTo([cx, 0.2, cz]);
}
// Pre-start invitation: a faint, breathing outline of headphones. No words.
function emitHeadphones() {
  const pts = [], m = camera.matrixWorld;
  const v = new THREE.Vector3();
  const P = (x, y) => { v.set(x, y, -2.4).applyMatrix4(m); pts.push([v.x, v.y, v.z, 1]); };
  for (let i = 0; i <= 70; i++) { const a = Math.PI * i / 70; P(Math.cos(a) * 0.36, Math.sin(a) * 0.34 - 0.02); }
  for (const sx of [-1, 1]) for (let i = 0; i < 46; i++) { const a = i / 46 * 2 * Math.PI; P(sx * 0.37 + Math.cos(a) * 0.075, -0.08 + Math.sin(a) * 0.12); P(sx * 0.37 + Math.cos(a) * 0.04, -0.08 + Math.sin(a) * 0.075); }
  emitSet(pts, [camera.position.x, camera.position.y + 0.3, camera.position.z - 2.4], { R: Infinity, life: 2.4, speed: 3, bright: 0.55, sizeMul: 0.9 });
}

/* =====================================================================
   AUDIO — everything synthesised
   ===================================================================== */
let AC = null;
const bus = {};
const NB = new WeakMap();
function nb(c) {
  let b = NB.get(c);
  if (!b) { const len = c.sampleRate * 2; b = c.createBuffer(1, len, c.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; NB.set(c, b); }
  return b;
}
function noiseSrc(c, t, dur) { const s = c.createBufferSource(); s.buffer = nb(c); s.loop = true; s.start(t, Math.random() * 1.5); s.stop(t + dur); return s; }
function loopNoise(c) { const s = c.createBufferSource(); s.buffer = nb(c); s.loop = true; s.start(0, Math.random() * 1.5); return s; }
function envG(c, t, a, peak, d) { const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); return g; }
function filt(c, type, f, Q = 1) { const b = c.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = Q; return b; }
function chain(...n) { for (let i = 0; i < n.length - 1; i++) n[i].connect(n[i + 1]); return n[n.length - 1]; }
function tone(c, type, f, t, dur) { const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.start(t); o.stop(t + dur); return o; }
function makePanner(c, x, y, z, ref = 0.6, roll = 1.1) {
  const p = c.createPanner(); p.panningModel = 'HRTF'; p.distanceModel = 'inverse';
  p.refDistance = ref; p.rolloffFactor = roll; p.maxDistance = 30; setPannerPos(p, x, y, z); return p;
}
function setPannerPos(p, x, y, z) { if (p.positionX) { p.positionX.value = x; p.positionY.value = y; p.positionZ.value = z; } else p.setPosition(x, y, z); }
function setListener(L, pos, fwd, up) {
  if (L.positionX) {
    L.positionX.value = pos[0]; L.positionY.value = pos[1]; L.positionZ.value = pos[2];
    L.forwardX.value = fwd[0]; L.forwardY.value = fwd[1]; L.forwardZ.value = fwd[2];
    L.upX.value = up[0]; L.upY.value = up[1]; L.upZ.value = up[2];
  } else { L.setPosition(...pos); L.setOrientation(...fwd, ...up); }
}

/* ---------- sound bank: S.name(ctx, out, t, opts) */
const S = {
  tick(c, out, t, o = {}) {
    chain(noiseSrc(c, t, 0.03), filt(c, 'bandpass', o.tock ? 2300 : 3100, 9), envG(c, t, 0.001, 2.0, 0.03), out);
    chain(tone(c, 'sine', o.tock ? 1500 : 1900, t, 0.05), envG(c, t, 0.001, 0.06, 0.02), out);
  },
  drip(c, out, t) {
    const s = c.createOscillator(); s.frequency.setValueAtTime(rand(1100, 1500), t); s.frequency.exponentialRampToValueAtTime(rand(380, 520), t + 0.07);
    chain(s, envG(c, t, 0.002, 0.6, 0.09), out); s.start(t); s.stop(t + 0.15);
    chain(noiseSrc(c, t, 0.04), filt(c, 'highpass', 3000), envG(c, t, 0.001, 0.06, 0.03), out);
  },
  raindrop(c, out, t) { chain(tone(c, 'sine', rand(2500, 5200), t, 0.05), envG(c, t, 0.001, rand(0.008, 0.03), 0.03), out); },
  bubble(c, out, t) {
    const s = c.createOscillator(); const f = rand(300, 800); s.frequency.setValueAtTime(f, t); s.frequency.exponentialRampToValueAtTime(f * 1.5, t + 0.05);
    chain(s, envG(c, t, 0.002, 0.06, 0.06), out); s.start(t); s.stop(t + 0.1);
  },
  gurgle(c, out, t) {
    const s = c.createOscillator(); s.type = 'triangle'; for (let i = 0; i < 14; i++) s.frequency.setValueAtTime(rand(110, 280), t + i * 0.11);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
    chain(s, filt(c, 'lowpass', 500), g, out); s.start(t); s.stop(t + 1.7);
    for (let i = 0; i < 3; i++) { const tt = t + 1.7 + i * rand(0.4, 0.9); chain(noiseSrc(c, tt, 0.02), filt(c, 'bandpass', 2600, 6), envG(c, tt, 0.001, 0.25, 0.02), out); }
  },
  thud(c, out, t, o = {}) {
    const k = o.strength || 1; const s = c.createOscillator(); s.frequency.setValueAtTime(95, t); s.frequency.exponentialRampToValueAtTime(42, t + 0.25);
    chain(s, envG(c, t, 0.004, 0.75 * k, 0.3), out); s.start(t); s.stop(t + 0.4);
    chain(noiseSrc(c, t, 0.2), filt(c, 'lowpass', 450), envG(c, t, 0.002, 0.6 * k, 0.15), out);
  },
  knock(c, out, t, o = {}) {
    const k = o.gain || 1, f = o.f || 210;
    const s = c.createOscillator(); s.type = 'triangle'; s.frequency.setValueAtTime(f, t); s.frequency.exponentialRampToValueAtTime(f * 0.8, t + 0.1);
    chain(s, envG(c, t, 0.002, 0.45 * k, 0.1), out); s.start(t); s.stop(t + 0.16);
    chain(noiseSrc(c, t, 0.06), filt(c, 'bandpass', f * 6.5, 4), envG(c, t, 0.001, 0.6 * k, 0.05), out);
  },
  pat(c, out, t, o = {}) { // palm on a soft/flat surface
    const k = o.gain || 1;
    chain(noiseSrc(c, t, 0.12), filt(c, 'lowpass', o.f || 900), envG(c, t, 0.006, 0.9 * k, 0.08), out);
    chain(noiseSrc(c, t + 0.05, 0.2), filt(c, 'bandpass', 2500, 0.8), envG(c, t + 0.05, 0.05, 0.05 * k, 0.12), out);
  },
  clang(c, out, t, o = {}) {
    const base = o.f || 420, k = o.gain || 1, dec = o.decay || 1.0;
    [1, 2.32, 4.25, 6.8].forEach((m, i) => chain(tone(c, 'sine', base * m * rand(0.99, 1.01), t, dec * 2), envG(c, t, 0.002, 0.22 * k / (i + 1), dec / (1 + i * 0.5)), out));
    chain(noiseSrc(c, t, 0.05), filt(c, 'highpass', 2000), envG(c, t, 0.001, 0.25 * k, 0.04), out);
  },
  clink(c, out, t, o = {}) {
    const f = o.f || 2600, k = o.gain || 1;
    [1, 1.58, 2.31].forEach((m, i) => chain(tone(c, 'sine', f * m, t, 0.5), envG(c, t, 0.001, 0.14 * k / (i + 1), 0.28 / (1 + i * 0.4)), out));
  },
  smash(c, out, t) {
    chain(noiseSrc(c, t, 0.5), filt(c, 'highpass', 2200), envG(c, t, 0.003, 0.5, 0.32), out);
    for (let i = 0; i < 30; i++) { const tt = t + Math.random() * Math.random() * 0.6; chain(tone(c, 'sine', rand(2200, 7500), tt, 0.35), envG(c, tt, 0.001, rand(0.03, 0.12), rand(0.05, 0.25)), out); }
    S.knock(c, out, t, { f: 300, gain: 0.6 });
  },
  creak(c, out, t, o = {}) {
    const d = o.dur || 0.7, k = o.gain || 1; const s = c.createOscillator(); s.type = 'sawtooth';
    s.frequency.setValueAtTime(rand(30, 45), t); for (let i = 1; i <= 7; i++) s.frequency.linearRampToValueAtTime(rand(16, 70), t + d * i / 7);
    const b1 = filt(c, 'bandpass', rand(700, 1000), 12), b2 = filt(c, 'bandpass', rand(1500, 2100), 16);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(2.4 * k, t + 0.05); g.gain.setValueAtTime(2.4 * k, t + d * 0.8); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(b1); s.connect(b2); b1.connect(g); b2.connect(g); g.connect(out); s.start(t); s.stop(t + d + 0.05);
  },
  rustle(c, out, t, o = {}) {
    for (let i = 0; i < (o.n || 7); i++) { const tt = t + rand(0, 0.5); chain(noiseSrc(c, tt, 0.08), filt(c, 'bandpass', rand(2500, 5000), 1), envG(c, tt, 0.005, rand(0.1, 0.22), 0.05), out); }
  },
  tinPick(c, out, t) {
    S.knock(c, out, t, { f: 330, gain: 0.4 });

function rayBox(o, d, mn, mx) {

    tmax = Math.min(tmax, t2); if (tmin > tmax) return null;

}
function rayWorld(o, d, maxT) {

  }
  if (best) { best.p = [o[0] + d[0] * best.t, o[1] + d[1] * best.t, o[2] + d[2] * best.t]; best.n = [0, 0, 0]; best.n[best.axis] = best.sign; }

}

  }
}

/* =====================================================================
   CAMERA / GLANCE
   ===================================================================== */
function glanceTo(p) {   // reflexive glance toward what you touched, so the outline is seen
  const cx = camera.position.x, cy = camera.position.y, cz = camera.position.z;
  const hd = hyp(p[0] - cx, p[2] - cz), ang = Math.atan2(p[1] - cy, hd);
  const vHalf = THREE.MathUtils.degToRad(FOV / 2), hHalf = Math.atan(Math.tan(vHalf) * camera.aspect);
  // pitch only — never turn the player, their sense of direction is all they have
  const base = P.glance ? P.glance.back : P.pitch;
  let tp = base;
  if (ang < base - vHalf * 0.6) tp = clamp(ang + vHalf * 0.45, -1.25, 0.4);
  if (ang > base + vHalf * 0.8) tp = clamp(ang - vHalf * 0.4, -1.25, 0.6);
  if (Math.abs(tp - base) > 0.01) P.glance = { pitch: tp, back: base, t0: now };
}
function updateCamera() {
  const bobY = Math.sin(P.bob) * 0.018 * (P.eyeT === EYE_STAND ? 1 : 0), bobR = Math.sin(P.bob * 0.5) * 0.006;
  let wob = 0; if (P.wobble) { const t = now - P.wobble.t0; if (t > 1.4) P.wobble = null; else wob = Math.sin(t * 11) * P.wobble.amp * (1 - t / 1.4); }
  camera.position.set(P.x, P.eye + bobY, P.z);
  camera.rotation.set(P.pitch + P.flinch * 0.18, P.yaw, P.roll + bobR + wob);
  camera.updateMatrixWorld();
  if (AC && !SIM) {
    const f = new THREE.Vector3(); camera.getWorldDirection(f);
    const u = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
    setListener(AC.listener, [camera.position.x, camera.position.y, camera.position.z], [f.x, f.y, f.z], [u.x, u.y, u.z]);
  }
}

/* =====================================================================
   INPUT — mouse / keyboard / gamepad. No on-screen anything.
   ===================================================================== */
const keys = new Set();
let mouseDX = 0, mouseDY = 0, mouseHeld = false;
const PAD = { lx: 0, ly: 0, rx: 0, ry: 0, prev: false, gp: null };
const REACH_KEYS = ['KeyE', 'Space', 'Enter', 'KeyF', 'NumpadEnter'];
const keysMoving = () => ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown'].some(c => keys.has(c)) || Math.abs(PAD.lx) + Math.abs(PAD.ly) > 0;
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (!G.started) { start(); return; }
  keys.add(e.code);
  if (!e.repeat && REACH_KEYS.includes(e.code)) reach();
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
renderer.domElement.addEventListener('mousedown', e => {
  if (!G.started) { start(); lockPointer(); return; }
  if (document.pointerLockElement !== renderer.domElement) lockPointer();
  if (e.button === 0) reach();
  mouseHeld = true;
});
addEventListener('mouseup', () => mouseHeld = false);
addEventListener('mousemove', e => {
  if (document.pointerLockElement === renderer.domElement || mouseHeld) { mouseDX += e.movementX || 0; mouseDY += e.movementY || 0; }
});
addEventListener('contextmenu', e => e.preventDefault());
function lockPointer() { try { const r = renderer.domElement.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (e) {} }
function pollPad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const gp of pads) {
    if (!gp || !gp.connected) continue;
    PAD.gp = gp;
    const dz = v => Math.abs(v) < 0.18 ? 0 : (v - Math.sign(v) * 0.18) / 0.82;
    PAD.lx = dz(gp.axes[0] || 0); PAD.ly = dz(gp.axes[1] || 0); PAD.rx = dz(gp.axes[2] || 0); PAD.ry = dz(gp.axes[3] || 0);
    const pressed = [0, 1, 2, 3, 5, 7].some(i => gp.buttons[i] && gp.buttons[i].pressed);
    if (pressed && !PAD.prev) { if (!G.started) start(); else reach(); }
    PAD.prev = pressed;
    return;
  }
  PAD.lx = PAD.ly = PAD.rx = PAD.ry = 0;
}
function rumble(strong, weak = 0.2, ms = 150) {
  const a = PAD.gp && PAD.gp.vibrationActuator;
  if (a && a.playEffect) a.playEffect('dual-rumble', { startDelay: 0, duration: ms, strongMagnitude: clamp(strong, 0, 1), weakMagnitude: clamp(weak, 0, 1) }).catch(() => {});
}

/* =====================================================================
   START / INTRO
   ===================================================================== */
function start() {
  if (G.started) return;
  G.started = true;
  initAudio(); if (AC.resume) AC.resume();
  if ('speechSynthesis' in window) {  // unlock speech inside the gesture
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
    pickVoice();
    setTimeout(() => { if (!speechSynthesis.getVoices().length) { VO.noVoices = true; console.warn('[still-here] no speech voices available — narration will be silent in this browser'); } }, 2500);
  }
  bus.ambience.gain.setValueAtTime(0, AC.currentTime); bus.ambience.gain.linearRampToValueAtTime(1, AC.currentTime + 5);
  setStage('intro');
  CAT.x = 0.05; CAT.z = 0.45; CAT.h = Math.PI / 2; catSetMode('feet');
  later(2.2, () => catMeow('normal'));
  later(4.0, () => { CAT.mode = 'rub'; catRubIntro(); });
  later(6.2, () => say("Mm...? Oh. It's you.", { pri: 3 }));
  later(9.2, () => catMeow('insistent'));
  later(10.8, () => say("Is it that time already?", { pri: 3 }));
  later(13.5, () => { P.busy = false; setStage('seated'); CAT.nextMeow = now + 6; });
}
function catRubIntro() {
  CAT.x = 0.18; CAT.z = 0.62; CAT.h = -Math.PI / 2;
  CAT.lastRub = now; CAT.purrHold = now + 6; play('fur', 'cat');
  sampleCat(CAT.x, CAT.z, CAT.h, [0.05, 0.2, 0.8], { life: 2.6 });
  catSetMode('feet');
}

/* =====================================================================
   LOOP
   ===================================================================== */
let lastT = performance.now(), hpT = 0;
camera.position.set(P.x, P.eye, P.z); camera.rotation.set(P.pitch, P.yaw, 0); camera.updateMatrixWorld();
buildKitchen();
function frame(ts) {
  const dt = Math.min(0.05, (ts - lastT) / 1000 || 0.016); lastT = ts;
  step(dt);
  pMat.uniforms.uTime.value = now;
  if (pDirty) { aPos.needsUpdate = aBirth.needsUpdate = aLife.needsUpdate = aSize.needsUpdate = aBright.needsUpdate = true; pDirty = false; }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
function step(dt) {
  now += dt;
  pollPad();
  if (!G.started) {
    updateCamera();
    if (now > hpT) { emitHeadphones(); hpT = now + 2.2; }
    return;
  }
  // timers
  for (let i = timers.length - 1; i >= 0; i--) if (timers[i].t <= now) { const t = timers.splice(i, 1)[0]; try { t.fn(); } catch (e) { console.error(e); } }
  // input
  const k = c => keys.has(c) ? 1 : 0;
  const mv = [k('KeyD') - k('KeyA') + PAD.lx, k('KeyW') + k('ArrowUp') - k('KeyS') - k('ArrowDown') - PAD.ly];
  const turn = (k('ArrowLeft') + k('KeyQ') - k('ArrowRight') - k('KeyZ')) * 1.9 * dt - PAD.rx * 2.3 * dt;
  let lookX = mouseDX * 0.0022 - turn, lookY = mouseDY * 0.0022 + PAD.ry * 1.6 * dt;
  mouseDX = mouseDY = 0;
  updatePlayer(dt, mv, lookX, lookY);
  updateCat(dt);
  hints();
  if (AC) ambienceSchedule();
  voiceWatchdog();
  updateCamera();
}
requestAnimationFrame(frame);

/* =====================================================================
   DEBUG / SELF-TESTS (console: __game.*)
   ===================================================================== */
async function testPan() {
  const res = {};
  for (const [label, yaw] of [['facing -z', 0], ['turned 180°', Math.PI]]) {
    const c = new OfflineAudioContext(2, 44100, 44100);
    const f = [-Math.sin(yaw), 0, -Math.cos(yaw)];
    setListener(c.listener, [0, 1.5, 0], f, [0, 1, 0]);
    const p = makePanner(c, 1, 1.5, 0); p.connect(c.destination);
    const n = c.createBufferSource(); n.buffer = nb(c); n.connect(p); n.start(0);
    const buf = await c.startRendering();
    const rms = ch => { const d = buf.getChannelData(ch); let s = 0; for (let i = 0; i < d.length; i++) s += d[i] * d[i]; return Math.sqrt(s / d.length); };
    res[label] = { L: +rms(0).toFixed(4), R: +rms(1).toFixed(4), louder: rms(1) > rms(0) ? 'right' : 'left' };
  }
  return res; // source at +x: expect "right" facing -z, "left" after turning
}
async function testLevels() {
  const out = {};
  const opts = { meow: [{}, { kind: 'insistent' }, { kind: 'yowl' }, { kind: 'mrrp' }] };
  for (const name of Object.keys(S)) {
    for (const o of (opts[name] || [{}])) {
      const c = new OfflineAudioContext(1, 44100 * 2.5, 44100);
      S[name](c, c.destination, 0.05, o);
      const buf = await c.startRendering(); const d = buf.getChannelData(0);
      let pk = 0, s = 0; for (let i = 0; i < d.length; i++) { const v = Math.abs(d[i]); if (v > pk) pk = v; s += v * v; }
      out[name + (o.kind ? ':' + o.kind : '')] = { peak: +pk.toFixed(3), rms: +Math.sqrt(s / d.length).toFixed(4) };
    }
  }
  { const c = new OfflineAudioContext(1, 44100 * 2, 44100); const l = makePurr(c, c.destination); l.gain.value = 0.9;
    const buf = await c.startRendering(); const d = buf.getChannelData(0); let pk = 0; for (const v of d) pk = Math.max(pk, Math.abs(v)); out.purr = { peak: +pk.toFixed(3) }; }
  return out;
}
// loudness of each landmark (loop + its one-shots, through its panner) heard from a few places
async function testLandmarks() {
  const spots = { chair: [0, 1.12, 1.05], cupboard: [-0.05, 1.55, -1.15], midRoom: [0.3, 1.55, 0.0], nearBowl: [-1.6, 1.55, 1.6] };
  const res = {};
  for (const [spotName, L] of Object.entries(spots)) {
    res[spotName] = {};
    for (const k of ['fridge', 'sink', 'clock', 'kettle', 'door', 'radiator', 'cat1m']) {
      const c = new OfflineAudioContext(2, 44100 * 4, 44100);
      setListener(c.listener, L, [0, 0, -1], [0, 1, 0]);
      const pos = k === 'cat1m' ? [L[0] + 1, 0.25, L[2]] : SRC[k];
      const [ref, roll] = k === 'cat1m' ? [0.5, 1.1] : PAN_PARAMS[k];
      const p = makePanner(c, ...pos, ref, roll); p.connect(c.destination);
      if (LOOPS[k]) LOOPS[k](c, p);
      for (let t = 0.1; t < 3.9;) {
        if (k === 'sink') { S.drip(c, p, t); t += 2; }
        else if (k === 'clock') { S.tick(c, p, t, {}); t += 1; }
        else if (k === 'door') { S.raindrop(c, p, t); t += 0.075; }
        else if (k === 'kettle') { S.bubble(c, p, t); t += 0.3; }
        else if (k === 'radiator') { S.gurgle(c, p, t); t = 99; }
        else if (k === 'cat1m') { S.meow(c, p, t, {}); t = 99; }
        else t = 99;
      }
      const buf = await c.startRendering(); let s = 0, n = 0;
      for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); for (let i = 0; i < d.length; i++) { s += d[i] * d[i]; n++; } }
      res[spotName][k] = +(20 * Math.log10(Math.sqrt(s / n) + 1e-9)).toFixed(1);   // dBFS
    }
  }
  return res;
}
function simulateCat(seconds = 180, stage = 'up') {
  const save = { ...CAT, stage: G.stage, now }, saveP = { x: P.x, z: P.z, lastMove: P.lastMove, glance: P.glance };
  SIM = true; G.stage = stage;
  let outside = 0, maxStuck = 0, stuckRun = 0, lx = CAT.x, lz = CAT.z, insideFurn = 0;
  const steps = Math.floor(seconds * 30);
  for (let i = 0; i < steps; i++) {
    now += 1 / 30;
    if (i % 300 === 0) { P.x = rand(-1.8, 1.8); P.z = rand(-1.0, 1.6); const r = collideCircle(P.x, P.z, PR, colPlayer); P.x = r.x; P.z = r.z; P.lastMove = now; }
    updateCat(1 / 30);
    if (Math.abs(CAT.x) > 2.4 || Math.abs(CAT.z) > 1.9) outside++;
    for (const c of colCat) { const [x0, z0, x1, z1] = c.b; if (CAT.x > x0 + 0.02 && CAT.x < x1 - 0.02 && CAT.z > z0 + 0.02 && CAT.z < z1 - 0.02) { insideFurn++; break; } }
    const m = hyp(CAT.x - lx, CAT.z - lz); lx = CAT.x; lz = CAT.z;
    if (m < 1e-4 && CAT.mode !== 'lead') stuckRun++; else stuckRun = 0; maxStuck = Math.max(maxStuck, stuckRun);
  }
  const result = { seconds, outsideFrames: outside, insideFurnitureFrames: insideFurn, longestStillSecs: +(maxStuck / 30).toFixed(1), finalMode: CAT.mode, lines: G.said.length };
  SIM = false; Object.assign(CAT, save); Object.assign(P, saveP); G.stage = save.stage; now = save.now; G.said = [];
  return result;
}
window.__game = { P, G, CAT, OBJ, objects, reach, start, standUp, feed, fall, stumble, testPan, testLevels, testLandmarks, simulateCat,
  teleport(x, z, yaw = P.yaw, pitch = P.pitch) { P.x = x; P.z = z; P.yaw = yaw; P.pitch = pitch; P.glance = null; },
  skipIntro() { timers.length = 0; P.busy = false; setStage('seated'); },
  // deterministic stepping for tests: hold keys (codes) for `sec` seconds of game time, then render
  advance(sec, hold = []) {
    hold.forEach(c => keys.add(c));
    for (let i = 0; i < Math.round(sec * 60); i++) step(1 / 60);
    hold.forEach(c => keys.delete(c));
    pMat.uniforms.uTime.value = now; aPos.needsUpdate = aBirth.needsUpdate = aLife.needsUpdate = aSize.needsUpdate = aBright.needsUpdate = true;
    renderer.render(scene, camera);
    return { x: +P.x.toFixed(2), z: +P.z.toFixed(2), yaw: +P.yaw.toFixed(2), pitch: +P.pitch.toFixed(2), stage: G.stage, line: G.lastLine, live: this.livePoints() };
  },
  voice: () => ({ voice: VO.v && VO.v.name, noVoices: VO.noVoices, count: 'speechSynthesis' in window ? speechSynthesis.getVoices().length : 0 }),
  livePoints() { let n = 0; for (let i = 0; i < PMAX; i++) if (now - pBirth[i] > 0 && now - pBirth[i] < pLife[i]) n++; return n; },
  get now() { return now; } };
if (DEBUG) log('debug on');
</script>
