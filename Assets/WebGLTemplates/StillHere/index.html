<!DOCTYPE html>
<html lang="en-gb">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Still Here</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
      body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #000; outline: none; touch-action: none; }
      /* a hair-thin, faint loading line; gone once the game is up */
      #sh-load { position: fixed; left: 0; bottom: env(safe-area-inset-bottom, 0px); height: 1px; width: 0; background: rgba(235, 240, 255, 0.35); transition: width .3s, opacity .8s; }
      #sh-error { position: fixed; inset: auto 16px 24px; color: #777; font: 13px system-ui, sans-serif; text-align: center; }
      #sh-haptic { position: fixed; left: -100px; top: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    </style>
    <script>
      // ---- 3D audio: make every panner the browser's own HRTF -------------------------------------------------
      // Unity's web audio creates one PannerNode per sound and never sets its panning model, so the browser
      // default ("equalpower", left/right only) is used. HRTF adds front/behind and up/down cues. Unity sets the
      // panners' rolloff to 0, so the game's own distance model still decides loudness.
      (function () {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        var proto = (window.BaseAudioContext && BaseAudioContext.prototype.createPanner) ? BaseAudioContext.prototype : Ctx.prototype;
        var orig = proto.createPanner;
        proto.createPanner = function () {
          var p = orig.apply(this, arguments);
          try { p.panningModel = "HRTF"; } catch (e) {}
          window.__shCtx = this;
          window.__shPanners = (window.__shPanners || 0) + 1;
          return p;
        };
        window.__shHrtf = true;
      })();

      // ---- iPhone audio: play even with the silent switch on, and unlock on the first real tap ----------------
      try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
      function shWake() { var c = window.__shCtx; if (c && c.state !== "running") { try { c.resume(); } catch (e) {} } }
      ["touchend", "click", "keydown"].forEach(function (ev) { window.addEventListener(ev, shWake, { passive: true }); });

      // ---- Haptics: gentle taps, never a buzz -----------------------------------------------------------------
      // kinds: 0 tick, 1 soft, 2 firm, 3 knock, 4 heavy, 5 purr, 6 burn
      var SH_VIBRATE = [[6], [10], [14], [24], [60, 40, 90], [10, 30, 10, 30, 10, 30, 10, 30, 10], [40, 30, 40]];
      var SH_IOS_TICKS = [1, 1, 1, 1, 2, 4, 2];
      window.shHaptic = function (kind) {
        try {
          if (navigator.vibrate) { navigator.vibrate(SH_VIBRATE[kind] || [8]); return; }
          // iPhone Safari has no vibration API. Since iOS 18, toggling a native switch gives a light system tick.
          var label = document.getElementById("sh-haptic");
          if (!label) return;
          var n = SH_IOS_TICKS[kind] || 1;
          for (var i = 0; i < n; i++) setTimeout(function () { label.click(); }, i * 45);
        } catch (e) {}
      };
    </script>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="sh-load"></div>
    <label id="sh-haptic" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>
    <script>
      // keep the page still: no scrolling, rubber-banding, pinch or double-tap zoom while playing
      ["touchmove", "gesturestart", "gesturechange", "dblclick"].forEach(function (ev) {
        document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
      });
      document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    </script>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var bar = document.getElementById("sh-load");
      var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: "Still Here",
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // phones: cap the render resolution, the picture is almost all black anyway
        devicePixelRatio: mobile ? Math.min(window.devicePixelRatio || 1, 2) : undefined,
      }, function (progress) {
        bar.style.width = (100 * progress) + "%";
      }).then(function () {
        bar.style.opacity = "0";
      }).catch(function (message) {
        var d = document.createElement("div"); d.id = "sh-error";
        d.textContent = "This browser couldn't start the game. " + message;
        document.body.appendChild(d);
      });
    </script>
  </body>
</html>
